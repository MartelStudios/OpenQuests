name: Release

# Run this from the Actions tab: it writes the version down, commits, tags and publishes.
# There is no tag trigger on purpose: the push below is made with a token that does start
# workflows, so a tag pushed here would fire a second, duplicate run.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the leading v, as in 1.0.0, or empty to release one mod below alone'
        required: false
        default: ''
      dialogues_version:
        description: 'Version of OpenDialogues to publish, or empty to leave it out'
        required: false
        default: ''
      openquestsdialogues_version:
        description: 'Version of the OpenQuests Dialogues bridge to publish, or empty to leave it out'
        required: false
        default: ''
      examples_version:
        description: 'Version of the OpenQuests Examples pack to publish, or empty to leave it out'
        required: false
        default: ''
      mmoskilltree_version:
        description: 'Version of the OpenQuests MMOSkillTree pack to publish with it, or empty to leave the pack out'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.pick.outputs.tag }}

    steps:
      # Every mod versioned on its own gets a tag of its own, so the next release of it alone finds
      # its last one. The GitHub release hangs on the first tag and carries only what it releases.
      - name: Pick the tags and the files
        id: pick
        env:
          VERSION: ${{ inputs.version }}
          DIALOGUES_VERSION: ${{ inputs.dialogues_version }}
          BRIDGE_VERSION: ${{ inputs.openquestsdialogues_version }}
          EXAMPLES_VERSION: ${{ inputs.examples_version }}
          PACK_VERSION: ${{ inputs.mmoskilltree_version }}
        run: |
          FILES=""
          TAGS=()
          if [[ -n "$VERSION" ]]; then
            TAGS+=("v$VERSION")
            FILES+=$'quests/core/build/libs/*.jar\nquests/extension/build/libs/*.jar\n'
          fi
          if [[ -n "$DIALOGUES_VERSION" ]]; then
            TAGS+=("dialogues-v$DIALOGUES_VERSION")
            FILES+=$'dialogues/build/libs/*.jar\n'
          fi
          if [[ -n "$BRIDGE_VERSION" ]]; then
            TAGS+=("openquestsdialogues-v$BRIDGE_VERSION")
            FILES+=$'mods/openquestsdialogues/build/libs/*.jar\n'
          fi
          if [[ -n "$EXAMPLES_VERSION" ]]; then
            TAGS+=("examples-v$EXAMPLES_VERSION")
            FILES+=$'quests/extension/build/distributions/*.zip\n'
          fi
          if [[ -n "$PACK_VERSION" ]]; then
            TAGS+=("mmoskilltree-v$PACK_VERSION")
            FILES+=$'mods/mmoskilltree/build/libs/*.jar\n'
          fi
          if [[ ${#TAGS[@]} -eq 0 ]]; then
            echo "::error::Give at least one version to release."
            exit 1
          fi
          TAG="${TAGS[0]}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          { echo "TAG=$TAG"; echo "TAGS=${TAGS[*]}"; echo "FILES<<EOF"; printf '%s' "$FILES"; echo "EOF"; } >> "$GITHUB_ENV"

      # An app installed on the repository is an actor the ruleset can name, which GITHUB_TOKEN
      # is not, and the version commit lands on main, so it needs that exception.
      - name: Mint a token for the release app
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Write the version down
        env:
          VERSION: ${{ inputs.version }}
          DIALOGUES_VERSION: ${{ inputs.dialogues_version }}
          BRIDGE_VERSION: ${{ inputs.openquestsdialogues_version }}
          EXAMPLES_VERSION: ${{ inputs.examples_version }}
          PACK_VERSION: ${{ inputs.mmoskilltree_version }}
        run: |
          if [[ -n "$VERSION" ]]; then
            sed -i "s/^version = .*/version = $VERSION/" gradle.properties
          fi
          if [[ -n "$DIALOGUES_VERSION" ]]; then
            sed -i "s/^dialogues_version = .*/dialogues_version = $DIALOGUES_VERSION/" dialogues/gradle.properties
          fi
          if [[ -n "$BRIDGE_VERSION" ]]; then
            sed -i "s/^openquestsdialogues_version = .*/openquestsdialogues_version = $BRIDGE_VERSION/" mods/openquestsdialogues/gradle.properties
          fi
          if [[ -n "$EXAMPLES_VERSION" ]]; then
            sed -i "s/^examples_version = .*/examples_version = $EXAMPLES_VERSION/" quests/extension/gradle.properties
          fi
          if [[ -n "$PACK_VERSION" ]]; then
            sed -i "s/^mmoskilltree_version = .*/mmoskilltree_version = $PACK_VERSION/" mods/mmoskilltree/gradle.properties
          fi

      # Regenerates every manifest.json from the property, so the tag carries a coherent tree
      - name: Build
        env:
          VERSION: ${{ inputs.version }}
        run: ./gradlew build ${VERSION:+-Pversion=$VERSION}

      - name: Commit and tag
        run: |
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.app-token.outputs.installation-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          git commit -am "chore: release ${TAG#v}"
          for tag in $TAGS; do git tag "$tag"; done
          git push origin HEAD $TAGS

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: ${{ env.FILES }}
          generate_release_notes: true
          fail_on_unmatched_files: true

      # Handed to the CurseForge job rather than rebuilt there: what is published has to be the
      # very same file the release carries, not one built again from the same sources.
      - name: Keep the artefacts for CurseForge
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: ${{ env.FILES }}
          if-no-files-found: error

  # A job of its own rather than a step of the release: it runs as soon as the release job
  # succeeds, so both land together, but a refusal from CurseForge leaves a complete GitHub
  # release behind and a job to re-run instead of a half-published version.
  curseforge:
    needs: release
    runs-on: ubuntu-latest

    env:
      TAG: ${{ needs.release.outputs.tag }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: OpenQuests
            relations: openquests-core:requiredDependency,opennavigation:requiredDependency,openquests-examples:optionalDependency
            project_id: '1678106'
            file: quests/extension/build/libs/OpenQuests-*.jar
          - name: OpenQuests Core
            relations: ''
            project_id: '1678101'
            file: quests/core/build/libs/OpenQuestsCore-*.jar
          - name: OpenQuests Examples
            relations: openquests:requiredDependency,openquests-dialogues:requiredDependency
            project_id: '1680200'
            file: quests/extension/build/distributions/OpenQuestsExamples-*.zip
            version_input: examples_version
          - name: OpenDialogues
            relations: ''
            project_id: '1775215'
            file: dialogues/build/libs/OpenDialogues-*.jar
            version_input: dialogues_version
          - name: OpenQuests Dialogues
            relations: openquests:requiredDependency,opendialogues:requiredDependency
            project_id: '1775233'
            file: mods/openquestsdialogues/build/libs/OpenQuestsDialogues-*.jar
            version_input: openquestsdialogues_version
          - name: OpenQuests MMOSkillTree
            relations: openquests:requiredDependency,mmo-skill-tree:requiredDependency,mmo-skill-tree-mastery-pack:optionalDependency
            project_id: '1752171'
            file: mods/mmoskilltree/build/libs/OpenQuestsMMOSkillTree-*.jar
            # Versioned on its own, and only published when a version is given for it
            version_input: mmoskilltree_version

    steps:
      - name: Fetch the artefacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts

      - name: Upload ${{ matrix.name }}
        if: inputs[matrix.version_input || 'version'] != ''
        env:
          TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          GAME_VERSION: ${{ vars.CURSEFORGE_GAME_VERSION }}
          VERSION: ${{ inputs[matrix.version_input || 'version'] }}
          NAME: ${{ matrix.name }}
          PROJECT_ID: ${{ matrix.project_id }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ env.TAG }}
          RELATIONS: ${{ matrix.relations }}
        run: |
          set -euo pipefail

          if [[ -z "$TOKEN" ]]; then
            echo "::error::CURSEFORGE_TOKEN is not set."
            exit 1
          fi

          if [[ -z "$GAME_VERSION" ]]; then
            echo "::error::Set the CURSEFORGE_GAME_VERSION variable to the Hytale version id this release targets."
            exit 1
          fi

          # Matched by name, so it does not matter how the download laid the tree out
          FILE=$(find . -type f -name "$(basename '${{ matrix.file }}')" -print -quit)

          if [[ -z "$FILE" ]]; then
            echo "::error::No artefact matching ${{ matrix.file }}"
            find . -type f \( -name '*.jar' -o -name '*.zip' \) -print
            exit 1
          fi

          jq -n --arg changelog "Released with [$TAG]($RELEASE_URL)." \
                --arg displayName "$NAME $VERSION" \
                --argjson versions "[$GAME_VERSION]" \
                '{changelog: $changelog, changelogType: "markdown", displayName: $displayName, releaseType: "release", gameVersions: $versions}' \
            > metadata.json

          # slug:type pairs, the way CurseForge names a dependency: by project, never by version
          if [[ -n "$RELATIONS" ]]; then
            jq --argjson projects "$(jq -nc --arg r "$RELATIONS" '$r | split(",") | map(split(":") | {slug: .[0], type: .[1]})')" \
               '. + {relations: {projects: $projects}}' metadata.json > metadata.tmp
            mv metadata.tmp metadata.json
          fi

          echo "Uploading $FILE to project $PROJECT_ID"
          cat metadata.json

          # A project is addressed by id on www, the host CurseForge documents for the auto-packager.
          # There is no per-game subdomain to pick: Hytale is not on the old Curse network.
          STATUS=$(curl -sS -o response.json -w '%{http_code}' -X POST \
            "https://www.curseforge.com/api/projects/$PROJECT_ID/upload-file" \
            -H "X-Api-Token: $TOKEN" \
            -F "metadata=<metadata.json" \
            -F "file=@$FILE")

          cat response.json

          if [[ "$STATUS" -lt 200 || "$STATUS" -ge 300 ]]; then
            echo "::error::CurseForge refused $NAME (HTTP $STATUS)"
            exit 1
          fi
