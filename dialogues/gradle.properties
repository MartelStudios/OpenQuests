# Versioned apart from OpenQuests: the mod stands on its own and is released on its own tag.
dialogues_version = 0.1.0

# Human-readable mod name, used for the jar.
mod_name = OpenDialogues

# Unique mod identifier, written into manifest.json as Name. What a dependent mod names in
# its own Dependencies, so it is the plugin's identity rather than its title.
mod_id = OpenDialogues

# Fully-qualified plugin entry point class.
main_class = com.martelstudios.opendialogues.OpenDialoguesPlugin

# Short description written into manifest.json.
mod_description = Dialogue trees for Hytale: pages, answers and actions

# Project website, source, or download URL.
mod_url = https://github.com/MartelStudios/OpenQuests

# Required manifest dependencies. Format: Group:Name=Version,Other:Mod=*
manifest_dependencies = Hytale:AssetModule=*

# Optional manifest dependencies. Same format as manifest_dependencies.
manifest_opt_dependencies =

# CurseForge project ID used by update checking. Filled in once the project exists there.
curseforgeID =
