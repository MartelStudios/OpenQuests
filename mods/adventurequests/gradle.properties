# Versioned apart from OpenQuests: the Adventure Quests pack also follows OpenDialogues and the bridge.
adventurequests_version = 1.12.0

# A content pack carries no plugin class.
main_class =

# Unique lowercase mod identifier.
mod_id = AdventureQuests

# Short description written into manifest.json.
mod_description = Quests, characters and dialogues that bring vanilla Hytale to life. Delete to start from an empty quest list.

# Required manifest dependencies. Format: Group:Name=Version,Other:Mod=*
manifest_dependencies = MartelStudios:OpenQuests=^5.4.0,MartelStudios:OpenDialogues=^2.4.0,MartelStudios:OpenQuestsDialogues=^1.3.0

# Optional manifest dependencies. Same format as manifest_dependencies.
manifest_opt_dependencies =

# CurseForge project ID used by update checking, if any.
curseforgeID = 1680200
