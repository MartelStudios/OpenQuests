# Versioned apart from OpenQuests and OpenDialogues: the bridge follows both.
openquestsdialogues_version = 1.0.0

# Fully-qualified plugin entry point class.
main_class = com.martelstudios.openquests.dialogues.OpenQuestsDialoguesPlugin

# Unique lowercase mod identifier.
mod_id = OpenQuestsDialogues

# Short description written into manifest.json.
mod_description = Bridge between OpenQuests and OpenDialogues: dialogue quest objectives

# Required manifest dependencies. Format: Group:Name=Version,Other:Mod=*
manifest_dependencies = MartelStudios:OpenQuestsCore=^5.1.0,MartelStudios:OpenQuests=^5.1.0,MartelStudios:OpenDialogues=^2.0.0

# Optional manifest dependencies. Same format as manifest_dependencies.
manifest_opt_dependencies =

# CurseForge project ID used by update checking, if any.
curseforgeID = 1775233
