# Versioned apart from OpenQuests: the pack follows MMOSkillTree's releases as much as ours.
mmoskilltree_version = 0.1.0

# Fully-qualified plugin entry point class.
main_class = com.martelstudios.openquests.mmoskilltree.OpenQuestsMMOSkillTreePlugin

# Unique lowercase mod identifier.
mod_id = OpenQuestsMMOSkillTree

# Short description written into manifest.json.
mod_description = OpenQuests quest and reward types for MMO Skill Tree

# Required manifest dependencies. Format: Group:Name=Version,Other:Mod=*
manifest_dependencies = MartelStudios:OpenQuestsCore=^5.0.0,MartelStudios:OpenQuests=^5.0.0,Ziggfreed:MMOSkillTree=*

# Optional manifest dependencies. Same format as manifest_dependencies.
manifest_opt_dependencies =

# CurseForge project ID used by update checking, if any.
curseforgeID = 1752171
