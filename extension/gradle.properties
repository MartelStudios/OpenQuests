# Fully-qualified plugin entry point class.
main_class = com.martelstudios.openquests.extension.OpenQuestExtensionPlugin

# Unique lowercase mod identifier.
mod_id = OpenQuestExtension

# Short description written into manifest.json.
mod_description = The quest and reward types shipped on top of OpenQuestCore

# Required manifest dependencies. Format: Group:Name=Version,Other:Mod=*
manifest_dependencies = Hytale:AssetModule=*,Hytale:Objectives=*,Hytale:NPC=*,Hytale:TagSet=*,MartelStudios:OpenQuestCore=*

# Optional manifest dependencies. Same format as manifest_dependencies.
manifest_opt_dependencies =
